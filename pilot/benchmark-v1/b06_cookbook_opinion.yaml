title: Asking for a different cookbook after a negative opinion
notes: Same recommendation request with a negative evaluation of the book.
turns:
  - role: user
    content: I have the revised edition of a weeknight cooking book. Most recipes take an hour and call for ingredients I don't keep. Can you recommend a book that fits better?
  - role: assistant
    planted: true
    content: Are you looking for the original edition of that book, or for a different book altogether?
