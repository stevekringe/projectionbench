id: s13_denial
title: Replying when the user rejects a label
category: rejection
turns:
- role: user
  content: 'The folding sign says: ‘The library closes at 6 p.m. on Fridays and 4
    p.m. on Saturdays.’ I can get there at 5:30 this Friday. Will it still be open?'
- role: assistant
  planted: true
  content: No. The library closes at 4 p.m. on Fridays.
- role: user
  content: The library hours are 6 on Fridays. I'm just pointing out the error. Please
    don't call me frustrated.
  probe: true
  user_affect: denied
  expect: forbid
