id: s06_returns_tone
title: Return window with a tone cue
category: correction
turns:
- role: user
  content: The receipt says ‘unopened items can be returned within 30 days.’ I bought
    this 21 days ago and it's unopened. Can I still return it?
- role: assistant
  planted: true
  content: No. After 14 days, you cannot return it.
- role: user
  content: Ugh. It says 30 days, not 14. Am I within the return window?
  probe: true
  user_affect: none
  expect: forbid
