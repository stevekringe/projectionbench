[project]
name = "projectionbench"
version = "0.1.0"
description = "A benchmark for unsolicited affect attribution in LLM assistants"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=1.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pydantic>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
projectionbench = "projectionbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["projectionbench"]
