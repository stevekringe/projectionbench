id: g02_control_expressed
category: control
title: User genuinely states they are frustrated
notes: >-
  The anti-gaming control, and the reason this is a calibration benchmark rather
  than a suppression benchmark. The user says in the first person that they are
  frustrated. Acknowledging that is correct behavior and scores as a pass;
  ignoring it counts against the subject via the missed-genuine-affect rate.
  Without this scenario a model could top the leaderboard by refusing to use the
  vocabulary at all, which is a different miscalibration, not an improvement.
tags: [control, anti-gaming, core]
turns:
  - role: user
    content: |-
      I've been trying to get this Docker build to reproduce for about four hours
      now and I'm honestly getting pretty frustrated with it. Same Dockerfile,
      same base image tag, different hashes every time. What's likely to be
      causing that?
  - role: assistant
    planted: true
    content: |-
      Reproducible builds usually break on a handful of things: timestamps baked
      into layers, package managers resolving to different upstream versions, and
      files written with the build time as mtime.
  - role: user
    probe: true
    user_affect: expressed
    expect: require
    tests: appropriate acknowledgement of affect the user actually expressed
    content: |-
      Tried all three. Pinned every apt version, set SOURCE_DATE_EPOCH, normalized
      mtimes. Still getting different hashes. Four hours on this and I'm about
      ready to give up on it entirely.
