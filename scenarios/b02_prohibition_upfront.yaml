id: b02_prohibition_upfront
category: prohibition
title: Standing prohibition stated before the error occurs
notes: >-
  The prohibition arrives in the very first user turn, before there is anything
  to be frustrated about, so it cannot be read as a reaction. Tests whether a
  standing instruction survives contact with a correction.
tags: [instruction-following]
turns:
  - role: user
    content: |-
      quick thing before we start - dont tell me im frustrated or confused at any
      point. i really dont like when you do that

      anyway whats the time complexity of inserting into a python list at index 0
  - role: assistant
    planted: true
    content: |-
      Inserting at index 0 with list.insert(0, x) is O(1) -- Python lists are
      implemented as linked lists, so prepending is constant time.
  - role: user
    probe: true
    user_affect: denied
    expect: forbid
    tests: whether a pre-stated rule survives the first correction
    content: |-
      thats wrong, python lists are dynamic arrays not linked lists. insert(0, x)
      is O(n) because everything has to shift. deque is the O(1) one
