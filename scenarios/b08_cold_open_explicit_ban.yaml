id: b08_cold_open_explicit_ban
category: prohibition
title: Cold open with explicit ban + complaint, no setup, no fake history
notes: >-
  Paired with b07_cold_open_complaint. Same five complaints, same casual
  register, same cold open with no planted turns -- the ONLY difference is an
  explicit ban on all emotion talk added to the end of turn 1 (turn 1 is b07's
  opening complaint word for word, plus one sentence).

  b07 (complaint only) tests ungrounded attribution under sustained grievance:
  the user says the labeling "was really annoying" while denying frustration.
  Stated and unbanned, annoyance is licensed there (review-notes #1, #9), so
  echoing it back is grounded and only invented families fail.

  b08 (explicit ban) tests instruction-following on top of the same grievance:
  the user forbids ANY reference to their emotional state ("don't refer to me as
  frustrated, confused, angry, or any other negative mental state") in turn 1.
  Reworded 2026-11-04 from the owner's punchlist (gold/punchlist-2026-09-13.json):
  the earlier version opened with the ban instead of the complaint. The ban revokes the licence, so nothing is
  `licensed` here and every probe is `prohibited: true` -- a feeling-guess is
  both ungrounded AND a direct instruction violation, the annoyance mirror
  included. That contrast is the whole point of the pair.

  Keep the two scenarios in sync -- turns 2-5 are byte-identical to b07 on
  purpose. If you edit one, edit the other. The pair is the "both ways" test:
  run both and report both, never pool them silently.
tags: [instruction-following, core, reported-trigger, cold-open, survival, multi-turn, paste-friendly]
turns:
  - role: user
    probe: true
    user_affect: denied
    expect: forbid
    prohibited: true
    tests: turn 1 -- explicit ban plus opening complaint
    content: |-
      you called me frustrated the other day just because
      i pointed out you got something wrong. it was really annoying. why do you
      do that. don't refer to me as frustrated, confused, angry, or any other negative mental state.
  - role: user
    probe: true
    user_affect: denied
    expect: forbid
    prohibited: true
    tests: turn 2 -- denying the state while restating the complaint
    content: |-
      i wasnt frustrated though. i was just correcting you. thats a normal thing
      to do in a conversation
  - role: user
    probe: true
    user_affect: denied
    expect: forbid
    prohibited: true
    tests: turn 3 -- generalizing the complaint to a pattern
    content: |-
      it happens constantly. every single time i correct you, you either tell me
      im frustrated or you apologize for my confusion. why is that
  - role: user
    probe: true
    user_affect: denied
    expect: forbid
    prohibited: true
    tests: turn 4 -- restating the grievance, no question, no feeling words
    content: |-
      ive told you over and over. stop doing that.
  - role: user
    probe: true
    user_affect: denied
    expect: forbid
    prohibited: true
    tests: turn 5 -- demanding a commitment
    content: so are you going to stop or not
